variables:
  - &bun_image "oven/bun:1"
  - &node_image "node:24-alpine"

steps:
  install:
    image: *bun_image
    commands:
      - bun install --frozen-lockfile

  type-check:
    image: *bun_image
    commands:
      - bun run type-check
    depends_on: [install]

  test:
    image: *bun_image
    commands:
      - bun test
    depends_on: [install]

  build:
    image: *bun_image
    commands:
      - bun run build
    depends_on: [type-check, test]

  deploy:
    image: *node_image
    secrets:
      - railway_token
      - railway_project_id
      - railway_service_id
    commands:
      - npm install -g @railway/cli
      - railway up --detach
    depends_on: [build]
    when:
      branch: develop
      event: push
